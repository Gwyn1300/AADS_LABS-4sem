
    <!DOCTYPE html>
    <html>
    <head>
        <title>Graph Visualization</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }
            .container {
                max-width: 1400px;
                margin: 0 auto;
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                overflow: hidden;
            }
            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                text-align: center;
            }
            .header h1 {
                font-size: 28px;
                margin-bottom: 5px;
            }
            .header p {
                opacity: 0.9;
                font-size: 14px;
            }
            .stats {
                display: flex;
                justify-content: center;
                gap: 30px;
                padding: 15px;
                background: #f8f9fa;
                border-bottom: 1px solid #e0e0e0;
            }
            .stat-card {
                text-align: center;
            }
            .stat-number {
                font-size: 24px;
                font-weight: bold;
                color: #667eea;
            }
            .stat-label {
                font-size: 12px;
                color: #666;
                margin-top: 5px;
            }
            #mynetwork {
                width: 100%;
                height: 600px;
                background: #fafafa;
            }
            .legend {
                padding: 15px 20px;
                background: #f8f9fa;
                border-top: 1px solid #e0e0e0;
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                font-size: 12px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .legend-color {
                width: 20px;
                height: 20px;
                border-radius: 50%;
            }
            .legend-arrow {
                width: 30px;
                height: 2px;
                background: #848484;
                position: relative;
            }
            .legend-arrow::after {
                content: "→";
                position: absolute;
                right: -12px;
                top: -8px;
                color: #848484;
                font-size: 14px;
            }
            .footer {
                text-align: center;
                padding: 15px;
                background: #f8f9fa;
                font-size: 11px;
                color: #999;
                border-top: 1px solid #e0e0e0;
            }
            @media (max-width: 768px) {
                .stats { gap: 15px; }
                .stat-number { font-size: 18px; }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>📊 DIRECTED GRAPH VISUALIZATION</h1>
                <p>Interactive network graph with edge weights</p>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">9</div>
                    <div class="stat-label">Vertices</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">23</div>
                    <div class="stat-label">Edges</div>
                </div>
            </div>
            <div id="mynetwork"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #97C2FC;"></div>
                    <span>Vertex (Node)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-arrow"></div>
                    <span>Directed Edge</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF6B6B; border-radius: 2px;"></div>
                    <span>Edge weight label</span>
                </div>
            </div>
            <div class="footer">
                Drag nodes to rearrange • Hover to see details • Refresh to reset layout
            </div>
        </div>
        <script>
            var nodes = new vis.DataSet([
                {id: 0, label: "Moscow", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 1, label: "SaintP", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 2, label: "Novosibirsk", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 3, label: "Ekaterinburg", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 4, label: "Nizhny", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 5, label: "Samara", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 6, label: "Omsk", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 7, label: "Chelyabinsk", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
            {id: 8, label: "Rostov", shape: "circle", color: {background: "#97C2FC", border: "#2B6FB6"}, font: {size: 14, color: "#333"}, size: 30},
        ]);

            var edges = new vis.DataSet([
                {from: 0, to: 0, label: "0", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 0, to: 1, label: "712", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 0, to: 2, label: "3357", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 0, to: 3, label: "1777", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 0, to: 4, label: "411", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 0, to: 8, label: "1086", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 1, to: 1, label: "712", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 1, to: 4, label: "796", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 2, to: 2, label: "3357", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 2, to: 6, label: "669", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 3, to: 3, label: "1777", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 3, to: 0, label: "1565", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 3, to: 7, label: "218", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 4, to: 4, label: "411", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 5, to: 5, label: "0", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 5, to: 8, label: "1050", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 6, to: 6, label: "0", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 6, to: 0, label: "669", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 7, to: 7, label: "0", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 7, to: 2, label: "218", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 7, to: 5, label: "805", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 8, to: 8, label: "1086", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
            {from: 8, to: 4, label: "1050", arrows: { from: { enabled: true, type: "arrow" }, to: { enabled: true, type: "arrow" } }, color: { color: "#848484", highlight: "#FF6B6B" }, font: { align: "middle", size: 12, background: "white", strokeWidth: 1 },
             smooth: { type: "curvedCW", roundness: 0.2 }},
        ]);

            var container = document.getElementById('mynetwork');
            var data = { nodes: nodes, edges: edges };
            var options = {
                nodes: {
                    shape: 'circle',
                    size: 30,
                    font: { size: 14, face: 'Segoe UI' }
                },
                edges: {
                    smooth: { type: 'curvedCW', roundness: 0.2 },
                    arrows: { to: { enabled: true, scaleFactor: 1 } },
                    font: { size: 12, align: 'middle', background: 'white', strokeWidth: 1 }
                },
                physics: {
                    enabled: true,
                    stabilization: { iterations: 100 },
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: { gravitationalConstant: -50, centralGravity: 0.01 }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    navigationButtons: true,
                    zoomView: true,
                    dragView: true
                },
                layout: {
                    improvedLayout: true
                }
            };
            var network = new vis.Network(container, data, options);

            // Добавляем обработчик клика для отображения информации
            network.on("click", function(params) {
                if (params.nodes.length > 0) {
                    var nodeId = params.nodes[0];
                    var node = nodes.get(nodeId);
                    console.log("Clicked on: " + node.label);
                }
            });
        </script>
    </body>
    </html>
